worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 100M;

    upstream achme_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen       82;
        server_name  _;
        client_max_body_size 100M;

        location / {
            root   /opt/achme/frontend/build;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            root   /opt/achme/frontend/build;
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            expires -1;
        }

        # API endpoints proxy with generous timeouts to prevent 504 Gateway Timeouts
        location ^~ /api/ {
            proxy_pass http://achme_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 100M;
        }

        # Uploads directory proxy for media, documents, PDFs, voice notes, and images
        location ^~ /uploads/ {
            proxy_pass http://achme_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 300s;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 100M;
        }

        # Socket.IO WebSocket proxy with persistent keepalive
        location ^~ /socket.io/ {
            proxy_pass http://achme_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 120s;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location = /health {
            proxy_pass http://achme_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        location = /nginx-health {
            return 200 "Nginx OK - ACHME CRM\n";
            add_header Content-Type text/plain;
        }

        location /static/ {
            root /opt/achme/frontend/build;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~ /\. {
            deny all;
        }

        access_log /var/log/nginx/achme-access.log;
        error_log /var/log/nginx/achme-error.log;
    }
}
