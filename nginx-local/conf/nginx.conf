worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    upstream achme_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen       82 default_server;
        server_name  localhost _;

        root   html/achme;
        index  index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
            expires -1;
        }

        # API proxy with 300s timeout to prevent 504 Gateway Timeouts
        location ^~ /api/ {
            proxy_pass http://achme_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            client_max_body_size   100M;
        }

        # Uploads proxy for media, voice notes, PDFs, spreadsheets, and photos
        location ^~ /uploads/ {
            proxy_pass http://achme_backend/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout  300s;
            proxy_send_timeout     300s;
            proxy_read_timeout     300s;
            client_max_body_size   100M;
        }

        # WebSocket Socket.IO proxy
        location ^~ /socket.io/ {
            proxy_pass http://achme_backend/socket.io/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_connect_timeout  120s;
            proxy_send_timeout     3600s;
            proxy_read_timeout     3600s;
            proxy_buffering        off;
        }

        location = /nginx-health {
            return 200 "Nginx OK - ACHME CRM\n";
            add_header Content-Type text/plain;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~ /\. {
            deny all;
        }
    }
}
